interpreter = ["bash", "-euo", "pipefail", "-c"]

[[task]]
name = "reuse"
group = "lints"
script = "reuse lint"

[[task]]
name = "markdownlint"
group = "lints"
script = """
git ls-files --cached --others --exclude-standard '*.md' | xargs markdownlint
"""

[[task]]
name = "nixdoc"
group = "lints"
script = """
tempdir="$(mktemp -d)"
cleanup() {
    rm -r "$tempdir"
}
trap cleanup EXIT

genref "$tempdir"

diff --recursive --color --unified "$tempdir" doc
"""
